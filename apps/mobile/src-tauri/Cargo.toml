[package]
name = "kennwort-mobile"
version = "0.0.1"
description = "Kennwort for Android and iOS: the shared web UI in a Tauri shell"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.95"
publish = false

# Tauri 3 is still an alpha (3.0.0-alpha.6, 2026-11-06); pinned exactly like every JS dependency,
# bumped on purpose. The layout follows tauri-cli 3.0.0-alpha.6, templates/app/src-tauri.
[lib]
name = "kennwort_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }
# Already in the tree through tauri-build; links the Swift plugin of the iOS autofill (build.rs)
tauri-utils = { version = "=3.0.0-alpha.4", features = ["build-2"] }

[dependencies]
tauri = { version = "=3.0.0-alpha.6", features = [], optional = true }
tauri-runtime-wry = { version = "=3.0.0-alpha.6", optional = true }
# Already in the tree through tauri; named for the server bridge (server.rs, bridge.rs) and the
# Android clipboard plugin (K-803)
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.9"

# The shell (Tauri and its webview) is on by default. Without it only the pure server rules build,
# so `cargo test --lib --no-default-features` runs their tests on a machine without GTK or an SDK
[features]
default = ["shell"]
shell = ["dep:tauri", "dep:tauri-runtime-wry"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
