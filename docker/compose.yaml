# Kennwort with Caddy as the TLS reverse proxy (K-703, docs/installation.md). Next to this file a
# .env (from kennwort.env.example) holds KENNWORT_DOMAIN, KENNWORT_AUTH_SECRET and, for the first
# start, KENNWORT_SETUP_CODE; it goes to the server as it is. Then:
#
#   docker compose up -d
#   docker compose exec kennwort /app/kennwort-server backup /data/backups/kennwort-$(date +%F).db
name: kennwort

services:
  kennwort:
    image: ghcr.io/speicherstadt/kennwort:${KENNWORT_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      KENNWORT_PUBLIC_URL: https://${KENNWORT_DOMAIN:?set KENNWORT_DOMAIN in .env}
      KENNWORT_BEHIND_PROXY: "true"
    volumes:
      - kennwort-data:/data
    # Only /data is written, and only by the image's unprivileged user
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No port of its own: only Caddy reaches it, on the network of this file

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      kennwort:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KENNWORT_DOMAIN: ${KENNWORT_DOMAIN:?set KENNWORT_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  kennwort-data:
  caddy-data:
  caddy-config:
