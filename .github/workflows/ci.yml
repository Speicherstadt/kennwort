name: CI

# Text only (Markdown, docs/, the license) changes no code: on main paths-ignore filters it, docs.yml checks docs/.
# A pull request always runs, so a required check never stays "Pending"; there the job changes skips the checks.
# The layout follows firsttris/haben (.github/workflows/ci.yml): a changes job, parts side by side, one result each.
# Every run stays under five minutes (the user's rule): the mutation tests take far longer and run nightly in
# mutation.yml instead, at the same 100 % (docs/plan.md, "Mutation-Tests nur nachts").
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call: # a later release.yml runs the same checks before publishing
  workflow_dispatch:

# A new push to a pull request cancels its outdated run; runs on main finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What a pull request touches. A job skipped by its `if` counts as passed for the rules on main, so every job
  # has !cancelled() and compares with 'false': when changes does not run (push, release, manual) or fails, its
  # outputs are empty and everything runs
  changes:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      # The pull request's merge commit and its first parent, the base
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        run: |
          set -euo pipefail
          # --no-renames: a moved file counts with its old and its new path
          changed="$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)"
          printf '%s\n' "$changed"
          # scripts/security-design.test.ts reads docs/plan.md and docs/sicherheitsdesign.md: they count as code
          tested='^docs/(plan|sicherheitsdesign)\.md$'
          other="$(grep -Ev '\.md$|^docs/|^LICENSE$' <<< "$changed" || true)$(grep -E "$tested" <<< "$changed" || true)"
          if [ -n "$changed" ] && [ -z "$other" ]; then code=false; else code=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # The image (K-703) builds only when its files change; release.yml builds it on every tag
          if grep -Eq '^(docker/|\.dockerignore$|\.github/workflows/release\.yml$)' <<< "$changed"; then image=true; else image=false; fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  unit:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: `checks pr` compares the branch with its base
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # The shared rule checks of firsttris/workflows (checks.json: files past 400 lines, functions past 80,
      # rings of imports between packages, Paraglide texts). Installed without saving: Bun fetches a GitHub
      # dependency as a tarball from api.github.com, which the agents' sandbox cannot reach, so it stays out of
      # package.json and bun.lock (a frozen install there would fail).
      - run: bun add --dev --no-save "github:firsttris/workflows#v1"
      - run: bunx checks
      - if: github.event_name == 'pull_request'
        run: bunx checks pr
      - run: bun run test
      - run: bun run build
      # K-408: a second build of the same commit, in another time zone and locale, must match the
      # first byte for byte: web app with release.json and release.sig, the extension for every
      # browser, the compiled server. One build more: about 8 s here (unit job about 2 min before)
      - run: bun run reproducible --reuse
      # The compiled server starts with an empty database and answers /health
      - run: bun run --cwd apps/server smoke
      # Known vulnerabilities in the dependencies fail the run
      - run: bun audit

  # What a user does, desktop and @phone, against the built web app: three parts side by side
  # (Playwright --shard), four workers each (playwright.config.ts), as many cores as the runner has
  e2e:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: e2e (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Ubuntu mirrors fail on the runners now and then ("Could not wait for server fd"): apt tries again
      - run: printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
      # Chromium from the cache, per Playwright version; the system libraries are installed on every run
      - id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - run: bun run e2e --shard=${{ matrix.shard }}/3

  # K-407: the extension's Firefox build in Firefox and its Safari build in WebKit, side by side with
  # the parts above (playwright.engines.config.ts). Playwright loads extensions only into Chromium,
  # so these run the built popup and the fill flow's code as pages (e2e/engines)
  engines:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Both engines in one job: each runs in about a minute, and a job of its own would wait for a
    # free runner as long as it runs whenever several pull requests are open (five-minute rule)
    name: engines (firefox, webkit)
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
      - id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-firefox-webkit
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps firefox webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps firefox webkit
      - run: bun run e2e:engines --project=firefox --project=webkit

  # K-703: only for a pull request that changes docker/: the Caddyfiles and compose.yaml as Caddy and
  # Compose read them, then the image built and started, healthy on /health, read-only and non-root.
  # Side by side with the parts above, about three minutes, so CI stays under five
  image:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.image == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Caddyfiles and compose.yaml
        working-directory: docker
        run: |
          set -euo pipefail
          for file in Caddyfile Caddyfile.static; do
            docker run --rm -e KENNWORT_DOMAIN=kennwort.example.org -v "$PWD:/etc/kennwort:ro" caddy:2.10 \
              caddy validate --adapter caddyfile --config "/etc/kennwort/$file"
          done
          printf 'KENNWORT_DOMAIN=kennwort.example.org\nKENNWORT_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" > .env
          docker compose config --quiet
          rm .env
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: kennwort:ci
      - name: Starts read-only as a user, healthy on /health
        run: |
          set -euo pipefail
          docker run -d --name kennwort --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e KENNWORT_AUTH_SECRET="$(openssl rand -hex 32)" -p 127.0.0.1:28710:8100 kennwort:ci
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' kennwort)"
            [ "$status" = healthy ] && break
            sleep 1
          done
          docker logs kennwort
          [ "$(docker inspect -f '{{.State.Health.Status}}' kennwort)" = healthy ]
          [ "$(docker inspect -f '{{.Config.User}}' kennwort)" = 65532:65532 ]
          curl -fsS http://127.0.0.1:28710/health
          curl -fsSI http://127.0.0.1:28710/ | grep -i "^content-security-policy: default-src 'none'; script-src 'self'"
          docker exec kennwort /app/kennwort-server backup /data/backups/ci.db

  # One result for the rules on main (required check "check"), however many parts the jobs split into
  check:
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [changes, unit, e2e, engines, image]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for result in "${{ needs.unit.result }}" "${{ needs.e2e.result }}" "${{ needs.engines.result }}" "${{ needs.image.result }}"; do
            case "$result" in success | skipped) ;; *) echo "A part ended with: $result"; exit 1 ;; esac
          done
