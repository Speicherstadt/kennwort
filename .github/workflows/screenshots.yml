# K-705: takes the screenshots of README.md and docs/ („Rundgang“) against the e2e servers with the
# test data of Weber Haustechnik (e2e/screenshots/screenshots.shot.ts): desktop and phone, light and
# dark, at deviceScaleFactor 2, and the extension's popup at 360 × 600; turns them into WebP under
# docs/assets/screenshots/. Only by hand (Actions → Update screenshots → Run workflow), never in CI.
#
# Never onto main: the workflow commits to the branch screenshots/update and opens (or updates) a
# pull request with GITHUB_TOKEN, so a person looks at the pictures before they are merged. The
# pictures are also uploaded as an artifact. Pull requests opened with GITHUB_TOKEN start no other
# workflows; push an empty commit to the branch or close and reopen the pull request to run CI.
# Prerequisite: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Update screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: screenshots/update
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends webp
      - run: bun run screenshots
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
      - name: Convert to WebP
        run: |
          mkdir -p docs/assets/screenshots
          for png in "$RUNNER_TEMP"/screenshots/*.png; do
            name="$(basename "$png" .png)"
            cwebp -quiet -q 82 -m 6 "$png" -o "docs/assets/screenshots/$name.webp"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/assets/screenshots/
      - name: Commit to screenshots/update and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/assets/screenshots && \
             test -z "$(git ls-files --others --exclude-standard docs/assets/screenshots)"; then
            echo "The screenshots are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add docs/assets/screenshots
          git commit -m "Update screenshots" -m "Taken by the workflow Update screenshots from ${GITHUB_SHA}."
          # The branch belongs to this workflow alone: it starts again from the current main each run
          git push --force origin "HEAD:refs/heads/$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "Update screenshots" \
              --body "Neue Screenshots aus dem Workflow „Update screenshots“ (${GITHUB_SHA}). Bitte die Bilder ansehen, bevor du mergst."
          fi
