# Documentation as a website: https://kennwort.app/
# Source is docs/, built with Zensical, which reads this file as it is
# (https://zensical.org/docs/setup/basics/); .github/workflows/docs.yml publishes it.
# Locally: pip install -r requirements-docs.txt && zensical serve
# German only.
site_name: Kennwort
site_description: >-
  Kennwort: der selbst gehostete, Ende-zu-Ende-verschlüsselte Passwortmanager für Teams in kleinen
  Betrieben – Web-App, Browser-Extension und App, ohne Kosten pro Benutzer.
site_author: Tristan Teufel
site_url: https://kennwort.app/
repo_url: https://github.com/Speicherstadt/kennwort
repo_name: Speicherstadt/kennwort
edit_uri: edit/main/docs/
copyright: >-
  Lizenz AGPL-3.0 · © Tristan Teufel und Mitwirkende ·
  <a href="https://teufel-it.de/de/impressum/">Impressum</a> ·
  <a href="https://speicherstadt.app/datenschutz/">Datenschutz</a>
use_directory_urls: false
validation:
  anchors: warn
theme:
  name: material
  # Link previews and structured data for the start page (overrides/main.html)
  custom_dir: overrides
  language: de
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle: { icon: material/weather-night, name: Dunkel }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle: { icon: material/weather-sunny, name: Hell }
plugins:
  - search
# The showcase start page (index.md)
extra_css:
  - assets/showcase.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
# The Solid 2.0 documentation is a copy for the agents (CLAUDE.md, "Solid 2.0"), English, with
# links into the Solid repository: not part of the website
exclude_docs: |
  solid-2.0/
nav:
  - Kennwort: index.md
  - Alle Funktionen: ueberblick.md
  - Konto und Entsperren: konto.md
  - Tresore: tresore.md
  - Einträge: eintraege.md
  - Einmal-Links: einmal-links.md
  - Mitteilungen: mitteilungen.md
  - Anmeldedienst und Deep Links: anmeldedienst.md
  - Handwerk und IT-Dienstleister: handwerk.md
  - Datenschutz: datenschutz.md
  - Sicherheits-Übersicht: sicherheit.md
  - Browser-Extension: extension.md
  - Kommandozeile: cli.md
  - Handy und App: handy.md
  - Import und Export: import-export.md
  - Betrieb:
      - Installation: installation.md
      - Verwaltung: verwaltung.md
      - Backups: backup.md
      - Updates: updates.md
      - Lasttest: lasttest.md
  - Kryptografie: kryptografie.md
  - Sicherheitsdesign: sicherheitsdesign.md
  - FAQ: faq.md
  - Entwicklung:
      - Projektplan: plan.md
